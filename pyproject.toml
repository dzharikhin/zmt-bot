[project]
name = "tg-zmt-bot"
version = "2.5.2"
description = ""
authors = [{ name = "Dmitriy Zharikhin", email = "jorixxx@mail.ru" }]
readme = "README.md"
requires-python = ">=3.14,<3.15,!=3.14.1"
# dependencies live in [tool.poetry.dependencies]: PEP 621 cannot express custom sources (torch)
dynamic = ["dependencies"]

[dependency-groups]
dev = [
    "black >=26.5.1,<27.0.0",
    "ruff >=0.16.10,<0.17.0",
    "pytest >=9.1.1,<10.0.0",
]

[tool.poetry]
# app repo, never packaged as a root distribution (Docker installs with --no-root)
package-mode = false

[tool.poetry.dependencies]
requests = "^2.34.2"
duckdb = "^1.5.6"
dacite = "^1.9.2"
telethon = "^1.45.0"
persist-queue = "^1.1.0"
scikit-learn = "^1.9.1"
optuna = "^5.0.0"
pyyaml = "^6.0.3"
torch = { version = "^2.14.1+cpu", source = "pytorch_cpu" }
panns-inference = "^0.1.1"
librosa = "^1.0.0"
essentia = "2.1b6.dev1438"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
