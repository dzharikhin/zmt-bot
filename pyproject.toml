[tool.poetry]
name = "tg-zmt-bot"
version = "2.2.5"
description = ""
authors = ["Dmitriy Zharikhin <jorixxx@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.14, <3.15"
requests = "^2.32.3"
duckdb = "^1.5.3"
dacite = "^1.9.2"
telethon = "^1.42.0"
persist-queue = "^1.0.0"
scikit-learn = "^1.8.0"
optuna = "^4.0.0"
pyyaml = "^6.0.2"
torch = {version = "^2.10.0", source = "pytorch_cpu"}
torchvision = {version = "^0.25.0", source = "pytorch_cpu"}
panns-inference = "^0.1.1"
librosa = "^0.11.0"
essentia = "2.1b6.dev1438"

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
ruff = "^0.11.2"
pytest = "^9.0.3"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
